<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown to LaTeX</title>
    <link rel="stylesheet" href="./src/frontend/style.css">
    <script type="module" src="./src/frontend/script.js"></script>
</head>
<body>
<h1>Markdown to LaTeX converter</h1>
<div class="settings-container">
    <div class="settings-sub-container">
        <span>Table options</span>
        <div class="setting">
            <input type="checkbox" id="table1">
            <label for="table1">Headers in boldface</label>
        </div>
        <div class="setting">
            <input type="checkbox" id="table2">
            <label for="table2">Outline every row</label>
        </div>
        <div class="setting">
            <input type="checkbox" id="table3" checked>
            <label for="table3">Outline every column</label>
        </div>
        <div class="setting">
            <input type="checkbox" id="table4">
            <label for="table4">Repeat headers at bottom of table</label>
        </div>
    </div>
    <div class="settings-sub-container">
        <div class="setting radio-buttons">
            <span>Position tables</span>
            <label>
                <input type="radio" name="table-float" value="h" checked>
                Approximate location
            </label>
            <label>
                <input type="radio" name="table-float" value="h!">
                Exact location
            </label>
            <label>
                <input type="radio" name="table-float" value="t">
                Top of page
            </label>
            <label>
                <input type="radio" name="table-float" value="b">
                Bottom of page
            </label>
            <label>
                <input type="radio" name="table-float" value="p">
                Separate page
            </label>
        </div>
    </div>
    <div class="settings-sub-container">
        <div class="setting radio-buttons">
            <span>Align tables</span>
            <label>
                <input type="radio" name="table-align" value="raggedright">
                Left
            </label>
            <label>
                <input type="radio" name="table-align" value="center" checked>
                Center
            </label>
            <label>
                <input type="radio" name="table-align" value="raggedleft">
                Right
            </label>
        </div>
    </div>
    <div class="settings-sub-container">
        <div class="setting radio-buttons">
            <span>Align table content</span>
            <label>
                <input type="radio" name="table-content-align" value="left">
                Left
            </label>
            <label>
                <input type="radio" name="table-content-align" value="center" checked>
                Center
            </label>
            <label>
                <input type="radio" name="table-content-align" value="right">
                Right
            </label>
        </div>
    </div>
    <div class="settings-sub-container">
        Image options
        <label for="image-path">Prepend relative path</label>
        <input type="text" placeholder="i.e. images/" id="image-path">
        <div class="setting">
            <input type="checkbox" id="image1" checked>
            <label for="image1">Merge images in figure</label>
        </div>
        <div class="setting">
            <input type="checkbox" id="image2" checked>
            <label for="image2">Generate labels</label>
        </div>
    </div>
    <div class="settings-sub-container">
        <div class="setting radio-buttons">
            <span>Position images</span>
            <label>
                <input type="radio" name="image-float" value="h" checked>
                Approximate location
            </label>
            <label>
                <input type="radio" name="image-float" value="h!">
                Exact location
            </label>
            <label>
                <input type="radio" name="image-float" value="t">
                Top of page
            </label>
            <label>
                <input type="radio" name="image-float" value="b">
                Bottom of page
            </label>
            <label>
                <input type="radio" name="image-float" value="p">
                Separate page
            </label>
        </div>
    </div>
    <div class="settings-sub-container">
        <div class="setting radio-buttons">
            <span>Align images</span>
            <label>
                <input type="radio" name="image-align" value="raggedright">
                Left
            </label>
            <label>
                <input type="radio" name="image-align" value="centering" checked>
                Center
            </label>
            <label>
                <input type="radio" name="image-align" value="raggedleft">
                Right
            </label>
        </div>
    </div>
</div>
<div class="io-container">
    <div class="input-output-field">
        <div class="io-button-container">
            <input type="file" id="upload-button" accept=".md, .markdown" class="io-button">
        </div>
        <textarea placeholder="Paste Markdown or select file..." class="io-textarea"></textarea>
    </div>
    <button type="button" id="convert-button">Convert</button>
    <div class="input-output-field">
        <div class="io-button-container">
            <button type="button" id="download-button" class="io-button" disabled>Download</button>
            <button type="button" id="copy-button" class="io-button" disabled>Copy</button>
        </div>
        <textarea placeholder="LaTeX appears here..." class="io-textarea"></textarea>
    </div>
</div>
<footer>
    Made with ❤️ •
    <a href="https://github.com/itsDirk/Markdown-to-Latex" target="_blank">GitHub</a> •
    <a href="https://github.com/itsDirk/Markdown-to-Latex/issues" target="_blank">Report an issue</a>
</footer>
</body>
</html>
